name: Build Chart Editor For All Platforms

on: workflow_dispatch

jobs:
  Build-Standard:
    name: ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - name: Android
            os: macos-15
            buildArgs: "android -ONLY_ARM64"
            artifactName: androidBuild
            artifactPath: "export/release/android/bin/app/build/outputs/apk/release/*.apk"
          - name: iOS
            os: macos-15
            buildArgs: "ios -final -nosign"
            artifactName: iOSBuild
            artifactPath: "export/release/ios/build/Release-iphoneos/Chart-Editor.ipa"
          - name: Windows
            os: windows-latest
            buildArgs: "windows -final -nosign"
            artifactName: WindowBuild
            artifactPath: export/release/windows/bin
          - name: MacOS
            os: macos-15
            buildArgs: "macos -final"
            artifactName: MacOSBuild
            artifactPath: export/release/macos/bin
          - name: Linux
            os: ubuntu-latest
            buildArgs: "linux -final -nosign"
            artifactName: LinuxBuild
            artifactPath: export/release/linux/bin
    uses: ./.github/workflows/build.yml
    with:
      name: ${{ matrix.name }}
      os: ${{ matrix.os }}
      buildArgs: ${{ matrix.buildArgs }}
      assetType: ${{ matrix.assetType }}
      artifactName: ${{ matrix.artifactName }}
      artifactPath: ${{ matrix.artifactPath }}

  Build-Consoles:
    name: ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - name: Nintendo 3DS
            os: ubuntu-latest
            buildArgs: "3ds -D haxe3ds -D final"
            artifactName: 3DSBuild
            artifactPath: "export/release/3ds/bin/*.cia"
         #- name: Wii U
         #  os: ubuntu-latest
         #  buildArgs: "wiiu -D final -D cafe"
         #  artifactName: WiiUBuild
         #  artifactPath: "export/release/wiiu/bin/*.wuhb"
    uses: ./.github/workflows/consoles.yml
    with:
      name: ${{ matrix.name }}
      os: ${{ matrix.os }}
      buildArgs: ${{ matrix.buildArgs }}
      artifactName: ${{ matrix.artifactName }}
      artifactPath: ${{ matrix.artifactPath }}
