name: Build

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      os:
        required: true
        type: string
      buildArgs:
        required: true
        type: string
      assetType:
        required: true
        type: string
      artifactName:
        required: true
        type: string
      artifactPath:
        required: true
        type: string

env:
  HAXE_VERSION: 4.3.6
  PROJECT_NAME: Chart-Editor

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Haxe
        if: inputs.name != 'Linux ARM64'
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Setup Haxe (Linux ARM)
        if: inputs.name == 'Linux ARM64'
        run: |
          sudo add-apt-repository ppa:haxe/releases -y
          sudo apt update
          sudo apt-get install -y haxe neko
          haxelib setup ~/haxelib

      - name: Install libVLC
        if: startsWith(inputs.name, 'Linux')
        run: sudo apt install libvlc-dev libvlccore-dev

      - name: Install Libraries
        run: |
          haxelib install hmm --quiet
          haxelib run hmm install --quiet

      - name: Install devkitPro & Wii U Toolchain (WUT)
        if: inputs.name == 'Wii U'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl build-essential make
          curl -A "Mozilla/5.0" -L https://apt.devkitpro.org/install-devkitpro-pacman -o install-devkitpro-pacman
          chmod +x install-devkitpro-pacman
          sudo ./install-devkitpro-pacman --yes
          sudo dkp-pacman -Syu --yes
          sudo dkp-pacman -S --yes ppc-dev wut-dev wuhbtool
          echo "DEVKITPRO=/opt/devkitpro" >> $GITHUB_ENV
          echo "DEVKITPPC=/opt/devkitpro/devkitPPC" >> $GITHUB_ENV
          echo "/opt/devkitpro/tools/bin" >> $GITHUB_PATH

      - name: Install devkitPro (For 3DS)
        if: inputs.name == 'Nintendo 3DS'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl gdebi-core
          curl -A "Mozilla/5.0" -sL https://apt.devkitpro.org/install-devkitpro-pacman | tr -d '\r' > install-devkitpro-pacman
          chmod +x install-devkitpro-pacman
          sudo ./install-devkitpro-pacman --yes
          sudo dkp-pacman -Syu --yes
          sudo dkp-pacman -S --yes 3ds-dev citro3d citro2d

      - name: Add Lime for ios
        if: inputs.name == 'iOS'
        run: | 
          haxelib remove lime
          haxelib git lime https://github.com/ArkoseLabsOfficial/lime --quiet

      - name: Configure Android
        if: inputs.name == 'Android'
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_21_arm64
          haxelib run lime config ANDROID_SETUP true

      - name: Setup HxCompileU (For Wii U)
        if: inputs.name == 'Wii U'
        run: |
          git clone https://github.com/Slushi-Github/hxCompileU.git
          cd hxCompileU
          haxe build.hxml
          cp export/haxeCompileU ../hxCompileU-bin
          cd ..
          ./hxCompileU-bin --prepare

      - name: Compile
        if: inputs.name != 'Wii U'
        run: haxelib run lime build ${{ inputs.buildArgs }} -D ${{ inputs.assetType }}

      - name: Compile for Wii U via HxCompileU
        if: inputs.name == 'Wii U'
        run: |
          ./hxCompileU-bin --compile

      - name: Make IPA
        if: inputs.name == 'iOS'
        run: |
          brew install ldid
          cd export/release/ios/build/Release-iphoneos/${{ env.PROJECT_NAME }}.app
          ldid -S../../../${{ env.PROJECT_NAME }}/${{ env.PROJECT_NAME }}.entitlements ${{ env.PROJECT_NAME }}
          cd ..
          mkdir Payload
          mv ${{ env.PROJECT_NAME }}.app Payload
          zip -r ${{ env.PROJECT_NAME }}.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: ${{ inputs.artifactName }}
          path: ${{ inputs.artifactPath }}
          if-no-files-found: error
